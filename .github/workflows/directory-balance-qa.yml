name: Directory balance visual review
on:
  push:
    branches: [directory-balance-qa-4717b1d]
permissions:
  contents: read
jobs:
  directory-visual-qa:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: jairoads_scratch_unified_browser, POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable-ci-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d jairoads_scratch_unified_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      APP_URL: http://127.0.0.1:8011
      DB_CONNECTION: pgsql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: jairoads_scratch_unified_browser
      DB_USERNAME: postgres
      DB_PASSWORD: disposable-ci-only
      DB_SSLMODE: disable
      SESSION_DRIVER: file
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: '4'
      JAIROADS_SCRATCH_APPROVAL: DISPOSABLE_LOCAL_ONLY
      PAO_DISABLE: '1'
      SUPABASE_URL: http://127.0.0.1:5799
      SUPABASE_SECRET_KEY: disposable-storage-only
      SUPABASE_SERVICE_ROLE_KEY: disposable-storage-only
      # Disposable PostgreSQL + local Storage mock only; production remains fail-closed.
      JAIROADS_PERMANENT_FILE_DELETION_ENABLED: 'true'
      QUARTERLY_BROWSER_URL: http://127.0.0.1:8011
      QUARTERLY_BROWSER_FIXTURE: /tmp/jairoads-unified-fixture.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: { php-version: '8.4', extensions: 'pdo_pgsql, mbstring', tools: 'composer:v2', coverage: none }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '22', cache: npm }
      - name: Build real application and prepare guarded disposable fixture
        run: |
          bash scripts/ci/install-composer.sh
          npm ci
          touch .env
          php artisan wayfinder:generate --with-form
      - name: Format changed directory sources and emit review patch
        run: |
          git diff --name-only 4717b1d6c972dc271dd19064899486a99cc5e95c HEAD -- resources tests/Browser > /tmp/directory-paths
          grep -E '\.(ts|tsx|mjs)
          node --experimental-strip-types tests/Browser/saved-geometry.mjs
          node --experimental-strip-types tests/Browser/field-contracts.mjs
          php tests/Browser/prepare-unified.php > "$QUARTERLY_BROWSER_FIXTURE"
          npm install --prefix "$RUNNER_TEMP/jairoads-browser" playwright@1.62.1
          bash scripts/ci/install-browser.sh "$RUNNER_TEMP/jairoads-browser/node_modules/.bin/playwright"
      - name: Real Fortify and canonical frontend browser acceptance
        run: |
          php artisan serve --host=127.0.0.1 --port=8011 --no-reload > /tmp/jairoads-unified-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$APP_URL/up" >/dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/jairoads-browser/node_modules/playwright/index.mjs" node tests/Browser/directory-balance-review.mjs
      - name: Print Laravel browser server log on failure
        if: failure()
        run: |
          cat /tmp/jairoads-unified-server.log || true
          if [ -f storage/logs/laravel.log ]; then tail -n 200 storage/logs/laravel.log; fi
 /tmp/directory-paths | xargs -r npx eslint --fix
          xargs -r npx prettier --write < /tmp/directory-paths
          npm run types:check
          python3 - <<'PY'
          import pathlib,subprocess,base64
          for path in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines():
              if not path.startswith(('resources/','tests/Browser/')):
                  continue
              encoded=base64.b64encode(pathlib.Path(path).read_bytes()).decode()
              for offset in range(0,len(encoded),3000):
                  print('DIRECTORY_FORMAT|'+path+'|'+str(offset)+'|'+encoded[offset:offset+3000])
          PY
      - name: Build formatted application and prepare test fixture
        run: |
          npm run build
          node --experimental-strip-types tests/Browser/saved-geometry.mjs
          node --experimental-strip-types tests/Browser/field-contracts.mjs
          php tests/Browser/prepare-unified.php > "$QUARTERLY_BROWSER_FIXTURE"
          npm install --prefix "$RUNNER_TEMP/jairoads-browser" playwright@1.62.1
          bash scripts/ci/install-browser.sh "$RUNNER_TEMP/jairoads-browser/node_modules/.bin/playwright"
      - name: Real Fortify and canonical frontend browser acceptance
        run: |
          php artisan serve --host=127.0.0.1 --port=8011 --no-reload > /tmp/jairoads-unified-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$APP_URL/up" >/dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/jairoads-browser/node_modules/playwright/index.mjs" node tests/Browser/unified.mjs
      - name: Print Laravel browser server log on failure
        if: failure()
        run: |
          cat /tmp/jairoads-unified-server.log || true
          if [ -f storage/logs/laravel.log ]; then tail -n 200 storage/logs/laravel.log; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Directory-UI-review-screenshots
          path: /tmp/jairoads-directory-review/*.png
          if-no-files-found: warn
