name: Temporary Wayfinder compatibility inspection
on:
  push:
    branches: [merged-system]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-wayfinder]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: |
          composer install --no-interaction --prefer-dist
          touch .env
          php artisan wayfinder:generate --with-form
          printf '\n=== BEGIN GENERATED REDIRECT CONTROLLER ===\n'
          sed -n '1,150p' resources/js/actions/Illuminate/Routing/RedirectController.ts
          printf '\n=== END GENERATED REDIRECT CONTROLLER ===\n'
