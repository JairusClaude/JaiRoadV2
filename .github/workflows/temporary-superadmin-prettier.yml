name: Temporary scoped SuperAdmin Prettier
on:
  push:
    branches: [merged-system]
permissions:
  contents: write
jobs:
  format-single-file:
    if: contains(github.event.head_commit.message, '[run-superadmin-prettier]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned formatter
        run: npm ci
      - name: Format exact dashboard source
        run: npx prettier --write resources/js/pages/dd-superadmin-command-center/Index.tsx
      - name: Commit only formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- resources/js/pages/dd-superadmin-command-center/Index.tsx
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Format SuperAdmin dashboard layout source"
            git push origin HEAD:merged-system
          fi
