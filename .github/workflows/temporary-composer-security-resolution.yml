name: Temporary Composer security resolution
on:
  push:
    branches: [merged-system]

permissions:
  contents: read

jobs:
  resolve:
    if: contains(github.event.head_commit.message, '[run-composer-security-upgrade]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          tools: composer:v2
          coverage: none
      - name: Resolve patched Laravel 13 with its full dependency set
        run: |
          composer require 'laravel/framework:^13.40' --with-all-dependencies --no-interaction --no-scripts
          composer validate --no-check-publish
          composer audit --locked --no-interaction
      - name: Emit resolved manifests for source-controlled review
        run: |
          printf '\nJAIROADS_COMPOSER_JSON_BEGIN\n'
          base64 -w0 composer.json
          printf '\nJAIROADS_COMPOSER_JSON_END\n'
          printf 'JAIROADS_COMPOSER_LOCK_BEGIN\n'
          base64 -w0 composer.lock
          printf '\nJAIROADS_COMPOSER_LOCK_END\n'
