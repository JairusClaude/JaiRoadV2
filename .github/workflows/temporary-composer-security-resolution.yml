name: Temporary Composer security resolution
on:
  push:
    branches: [merged-system]

permissions:
  contents: write

jobs:
  resolve:
    if: contains(github.event.head_commit.message, '[run-composer-security-upgrade]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          tools: composer:v2
          coverage: none
      - name: Resolve patched Laravel 13 with its full dependency set
        run: |
          composer require 'laravel/framework:^13.40' --with-all-dependencies --no-interaction --no-scripts
          composer validate --no-check-publish
          composer audit --locked --no-interaction
      - name: Archive resolved Composer manifests for review
        uses: actions/upload-artifact@v4
        with:
          name: patched-laravel-dependencies
          path: |
            composer.json
            composer.lock
          if-no-files-found: error
          retention-days: 1
      - name: Commit only audited Composer manifests back to merged-system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git diff --cached --check
          git commit -m "Upgrade Laravel to patched 13.x with resolved Composer lockfile"
          git push origin HEAD:merged-system
