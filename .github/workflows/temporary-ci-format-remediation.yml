name: Temporary repository formatter
on:
  push:
    branches: [merged-system]
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[run-style-remediation]')
    runs-on: ubuntu-latest
    env:
      PAO_DISABLE: '1'
      COMPOSER_NO_INTERACTION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact repository dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          touch .env
          php artisan wayfinder:generate --with-form
      - name: Apply Pint Prettier ESLint and Prettier in dependency order
        run: |
          composer lint
          npm run format
          npm run lint
          npm run format
          git diff --check
      - name: Commit formatted source, excluding generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app bootstrap config database resources routes tests tools
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Run Pint Prettier and ESLint source formatters"
            git push origin HEAD:merged-system
          fi
