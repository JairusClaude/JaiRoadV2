name: JaiROADS Final DD remote Pint diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/final-dd-format-diagnostics.yml'
      - 'app/Services/ActivityNotifications.php'
      - 'app/Services/AccountIdentityResolver.php'
      - 'app/Services/OperationAudit.php'
      - 'tests/Quarterly/AuditNotificationConsistencyTest.php'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Display required Pint-only formatting diff (does not commit)
        run: |
          vendor/bin/pint app/Services/ActivityNotifications.php app/Services/AccountIdentityResolver.php app/Services/OperationAudit.php tests/Quarterly/AuditNotificationConsistencyTest.php tests/Quarterly/PostgresTestCase.php tests/TestCase.php
          git diff -- app/Services/ActivityNotifications.php app/Services/AccountIdentityResolver.php app/Services/OperationAudit.php tests/Quarterly/AuditNotificationConsistencyTest.php tests/Quarterly/PostgresTestCase.php tests/TestCase.php
