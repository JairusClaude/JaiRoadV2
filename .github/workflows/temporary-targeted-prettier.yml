name: Temporary targeted Prettier remediation
on:
  push:
    branches: [merged-system]
permissions:
  contents: write
jobs:
  targeted-format:
    if: contains(github.event.head_commit.message, '[run-targeted-prettier]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply checked-in Prettier version to browser regression sources
        run: npx prettier --write tests/Browser/account-terminology.mjs tests/Browser/lifecycle.mjs tests/Browser/responsive-workspaces.mjs tests/Browser/docker-smoke.mjs
      - name: Commit source-only formatting, never CI configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/Browser/account-terminology.mjs tests/Browser/lifecycle.mjs tests/Browser/responsive-workspaces.mjs tests/Browser/docker-smoke.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Format browser regression tests with pinned Prettier"
            git push origin HEAD:merged-system
          fi
