name: Temporary Pint format diagnostic

on:
  push:
    branches: [fix/isolated-integration-readiness]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install code style dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts
      - name: Print exact Laravel Pint corrections
        run: |
          ./vendor/bin/pint app/Services/IntegrationDeploymentReadiness.php tests/Quarterly/IntegrationDeploymentReadinessTest.php
          echo '===== START DIFF ====='
          git diff -- app/Services/IntegrationDeploymentReadiness.php tests/Quarterly/IntegrationDeploymentReadinessTest.php
          echo '===== END DIFF ====='
