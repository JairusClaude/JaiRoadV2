version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Track Laravel security and compatible Composer dependency updates on
  # the integration branch, so the lockfile is regenerated and CI exercises
  # the complete resolved dependency set before a reviewer merges it.
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "merged-system"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
