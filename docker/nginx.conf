# Debian's hardened fastcgi_params passes $host without its port. Keep that
# validated hostname and recover only the port from the request authority.
map $http_host $jairoads_header_port {
    default "";
    "~:(?<jairoads_header_port_digits>[0-9]{1,5})$" :$jairoads_header_port_digits;
}

map $request $jairoads_request_port {
    default $jairoads_header_port;
    # Absolute-form request targets take precedence over the Host header.
    "~*^[^ ]+ https?://(?:\[[^]]+\]|[^/: ]+):(?<jairoads_absolute_port>[0-9]{1,5})(?:[/? ]|$)" :$jairoads_absolute_port;
    "~*^[^ ]+ https?://" "";
}

server {
    error_log /dev/stderr warn;
    access_log /dev/stdout;
    listen 0.0.0.0:10000;
    server_name _;
    client_max_body_size 21m;
    root /var/www/html/public;
    index index.php;

    # Keep app files outside public/ inaccessible.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_HOST $host$jairoads_request_port;
    }

    location ~ /\. {
        deny all;
    }
}

