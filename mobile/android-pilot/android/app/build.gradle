plugins {
    id 'com.android.application' version '8.9.1'
}

android {
    namespace 'org.jairoads.fieldpilot'
    compileSdk 35

    defaultConfig {
        applicationId 'org.jairoads.fieldpilot.review.mobile'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '0.4.2-review'
    }

    sourceSets {
        main.assets.srcDir '../../build/web'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
