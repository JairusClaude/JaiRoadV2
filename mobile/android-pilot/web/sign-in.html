<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#f3e9da" />
        <meta name="referrer" content="same-origin" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; form-action 'self'"
        />
        <title>Sign in · JaiROADS</title>
        <script type="module" src="./sign-in.ts"></script>
    </head>
    <body>
        <div class="screen">
            <header class="hero">
                <div class="brand">
                    <img
                        src="../../../public/images/jairoads/peo-ddo-transparent.webp"
                        width="48"
                        height="48"
                        alt=""
                    />
                    <div>
                        <strong>JaiROADS</strong>
                        <small>Road infrastructure management</small>
                    </div>
                </div>
                <button type="button" class="outline" id="explore">
                    Explore <span aria-hidden="true">→</span>
                </button>
                <div class="landscape" aria-hidden="true"></div>
            </header>
            <main class="panel" id="sign-in-panel">
                <div class="panel-top">
                    <span>Secure workspace</span>
                    <a href="./index.html">Field Reports</a>
                </div>
                <h1>Welcome back</h1>
                <p class="description">Sign in to your JaiROADS workspace.</p>
                <form
                    id="credentials"
                    method="post"
                    action="/login"
                    aria-describedby="sign-in-status"
                >
                    <div class="field">
                        <label for="email">Email address</label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            inputmode="email"
                            autocomplete="username"
                            autocapitalize="none"
                            spellcheck="false"
                            placeholder="you@example.com"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password">
                            <input
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="current-password"
                                placeholder="Enter your password"
                                required
                            />
                            <button
                                type="button"
                                id="show-password"
                                aria-controls="password"
                                aria-label="Show password"
                            >
                                <svg
                                    aria-hidden="true"
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.6"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path
                                        d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"
                                    />
                                    <circle cx="12" cy="12" r="2.7" />
                                    <path
                                        id="password-slash"
                                        d="m3 3 18 18"
                                        visibility="hidden"
                                    />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <label class="remember">
                        <input
                            name="remember"
                            type="checkbox"
                            aria-describedby="remember-help"
                        />
                        Keep me signed in
                    </label>
                    <button class="primary" id="submit" type="submit" disabled>
                        Sign in <span aria-hidden="true">→</span>
                    </button>
                </form>
                <p
                    class="note status"
                    id="sign-in-status"
                    role="status"
                    hidden
                ></p>
                <p class="note" id="remember-help">
                    Use only on a private, trusted device.
                </p>
                <p class="note">Need help? Contact your administrator.</p>
            </main>
            <section
                id="showcase"
                class="showcase"
                aria-label="Explore JaiROADS"
                hidden
            >
                <div class="photo"><img id="slide-image" alt="" /></div>
                <div class="caption" aria-live="polite">
                    <p id="slide-label" class="eyebrow"></p>
                    <h2 id="slide-title"></h2>
                    <p id="slide-description" class="description"></p>
                </div>
                <div class="showcase-controls">
                    <span id="slide-position" aria-hidden="true"></span>
                    <button
                        class="outline"
                        id="previous"
                        type="button"
                        aria-label="Previous slide"
                    >
                        ←
                    </button>
                    <button
                        class="outline"
                        id="next"
                        type="button"
                        aria-label="Next slide"
                    >
                        →
                    </button>
                </div>
                <button id="continue" class="primary" type="button">
                    Continue to sign in
                </button>
            </section>
        </div>
    </body>
</html>
